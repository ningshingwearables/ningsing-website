<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>A Memory — NINGSHING</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, Helvetica, sans-serif;
  background: #111;
  color: #fff;
  min-height: 100vh;
}

.page {
  max-width: 650px;
  margin: auto;
  padding: 35px 22px 60px;
}

.brand {
  font-size: 12px;
  letter-spacing: 4px;
  opacity: 0.55;
  text-align: center;
}

.memory {
  margin-top: 55px;
  text-align: center;
}

.memory-label {
  font-size: 10px;
  letter-spacing: 4px;
  text-transform: uppercase;
  opacity: 0.45;
}

h1 {
  font-size: 42px;
  line-height: 1;
  letter-spacing: -2px;
  margin-top: 18px;
}

.subtitle {
  color: #999;
  margin-top: 15px;
  font-size: 14px;
}

.photo {
  margin-top: 40px;
  width: 100%;
  aspect-ratio: 4 / 5;
  background: linear-gradient(145deg,#333,#777);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #bbb;
  letter-spacing: 2px;
  font-size: 11px;
}

.message {
  margin-top: 40px;
  padding: 30px 20px;
  border-top: 1px solid #333;
  border-bottom: 1px solid #333;
  font-size: 18px;
  line-height: 1.7;
  color: #ddd;
}

.music {
  margin-top: 35px;
  padding: 22px;
  border: 1px solid #333;
  text-align: left;
}

.music-label {
  font-size: 9px;
  letter-spacing: 3px;
  color: #777;
}

.song {
  margin-top: 8px;
  font-size: 16px;
}

.footer {
  margin-top: 60px;
  text-align: center;
  font-size: 10px;
  letter-spacing: 3px;
  color: #555;
}
</style>
</head>

<body>

<div class="page">

  <div class="brand">
    NINGSHING WEARABLES
  </div>

  <div class="memory">

    <div class="memory-label">
      A memory worth keeping
    </div>

    <h1>For You.</h1>

    <p class="subtitle">
      Some moments deserve to live forever.
    </p>

    <div class="photo">
      YOUR PHOTO
    </div>

    <div class="message">
      “No matter how much time passes,
      I'll always remember this moment with you.”
    </div>

    <div class="music">

      <div class="music-label">
        THIS MEMORY HAS A SOUND
      </div>

      <div class="song">
        ▶ Your special song
      </div>

    </div>

  </div>

  <div class="footer">
    MEMORIES, MADE WEARABLE.
  </div>

</div>

</body>
</html>
